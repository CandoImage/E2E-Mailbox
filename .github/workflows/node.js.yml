# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Self-hosted catch-all SMTP servers for the Inbucket and Mailpit test suites.
    services:
      inbucket:
        image: inbucket/inbucket
        ports:
          - 9000:9000
          - 2500:2500
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    # Skip the prepare script on install, the steps below run it explicitly.
    - run: yarn install --frozen-lockfile --ignore-scripts
    - run: yarn build
    - run: yarn lint
    - run: yarn test
      env:
        INBUCKET_URL: http://localhost:9000
        MAILPIT_URL: http://localhost:8025
        # Optional, the Mailsac suite is skipped without it.
        MAILSAC_API_KEY: ${{ secrets.MAILSAC_API_KEY }}
